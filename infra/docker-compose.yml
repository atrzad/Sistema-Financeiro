name: sistema-financeiro

# Uso:
#   docker compose --env-file .env -f infra/docker-compose.yml --profile infra up -d   # só dependências
#   docker compose --env-file .env -f infra/docker-compose.yml --profile app up -d     # tudo, inclusive API e worker

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://app_api:${APP_API_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_URL_OWNER: postgresql+asyncpg://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET_COMPROVANTES: ${S3_BUCKET_COMPROVANTES:-comprovantes}
  S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-exports}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [infra, app]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      APP_API_PASSWORD: ${APP_API_PASSWORD}
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [infra, app]
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: [infra, app]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ['9000:9000', '9001:9001']
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Cria os buckets na primeira subida. `comprovantes` nasce com Object Lock
  # (implica versionamento) para garantir imutabilidade dos originais (RNF02).
  minio-init:
    image: minio/mc:latest
    profiles: [infra, app]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing --with-lock local/$${S3_BUCKET_COMPROVANTES} &&
      mc mb --ignore-existing local/$${S3_BUCKET_EXPORTS} &&
      echo 'buckets prontos'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_COMPROVANTES: ${S3_BUCKET_COMPROVANTES:-comprovantes}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-exports}

  api:
    build: ../backend
    profiles: [app]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    ports: ['8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: ../backend
    profiles: [app]
    command: celery -A app.workers.celery_app worker -l info -Q celery,validation,ocr,reports,maintenance
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
