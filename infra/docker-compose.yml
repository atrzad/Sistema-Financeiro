name: sistema-financeiro

# Uso:
#   docker compose --env-file .env -f infra/docker-compose.yml --profile infra up -d   # só dependências
#   docker compose --env-file .env -f infra/docker-compose.yml --profile app up -d     # tudo, inclusive API e worker

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://app_api:${APP_API_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_URL_OWNER: postgresql+asyncpg://app_owner:${APP_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://storage:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET_COMPROVANTES: ${S3_BUCKET_COMPROVANTES:-comprovantes}
  S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-exports}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  JWT_SECRET: ${JWT_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [infra, app]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      APP_API_PASSWORD: ${APP_API_PASSWORD}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [infra, app]
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage S3-compatible de desenvolvimento. RustFS substitui o MinIO, que deixou
  # de publicar imagens da edição comunitária. Em produção o storage é o AWS S3.
  storage:
    image: rustfs/rustfs:latest
    profiles: [infra, app]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['${S3_PORT:-9000}:9000', '${S3_CONSOLE_PORT:-9001}:9001']
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 10

  # Cria os buckets na primeira subida (idempotente). `comprovantes` nasce com
  # Object Lock (implica versionamento) para garantir imutabilidade dos originais (RNF02).
  storage-init:
    image: amazon/aws-cli:latest
    profiles: [infra, app]
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET_COMPROVANTES: ${S3_BUCKET_COMPROVANTES:-comprovantes}
      BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS:-exports}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        s3() { aws --endpoint-url http://storage:9000 s3api "$$@"; }
        s3 head-bucket --bucket "$$BUCKET_COMPROVANTES" 2>/dev/null ||
          s3 create-bucket --bucket "$$BUCKET_COMPROVANTES" --object-lock-enabled-for-bucket
        s3 head-bucket --bucket "$$BUCKET_EXPORTS" 2>/dev/null ||
          s3 create-bucket --bucket "$$BUCKET_EXPORTS"
        echo 'buckets prontos'

  api:
    build: ../backend
    profiles: [app]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *backend-env
    ports: ['8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }

  worker:
    build: ../backend
    profiles: [app]
    command: celery -A app.workers.celery_app worker -l info -Q celery,validation,ocr,reports,maintenance
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  storagedata:
