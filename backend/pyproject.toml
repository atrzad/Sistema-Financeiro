[project]
name = "financeiro-backend"
version = "0.1.0"
description = "API do Sistema de Lançamento e Prestação de Contas"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.102",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-magic>=0.4.27",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.102",
    "celery-types>=0.26.0",
    "fakeredis>=2.38.0",
    "httpx>=0.28.1",
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos em strings/comentários são intencionais (pt-BR)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["integration: exige Postgres/Redis/storage reais (pulado se indisponível)"]
